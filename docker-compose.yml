version: '3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - static:/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: bash -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn --bind 0.0.0.0:8000 kittygram_backend.wsgi"

  frontend:
    build: ./frontend
    volumes:
      - static:/staticfiles
    command: cp -r /app/build/. /staticfiles/

  gateway:
    build: ./nginx
    ports:
      - "8000:80"
    volumes:
      - static:/staticfiles
      - media:/media
    depends_on:
      - backend
